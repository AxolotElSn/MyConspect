<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <script defer src="script.js"></script> defer - атрибут сообщает браузеру что этот скрипт должен работать в фоновом режиме. 1 Скрипты с defer никогда не блокирует страницу. 2 Скрипт дожидается когда страница загрузится -->
    <script async src="test.js"></script> <!-- Стнарица не ждет асинхронных скриптов. Скрипт загружается в фоновом режиме, но запускается как только до него дойдет очередь -->
    <p>Hello Worls!</p>
    <p>Second Hello!</p>

    
</body>
</html>
